# Example configuration for build-aosp.sh.
#
# Usage:
#   cp build-aosp.example.yaml build-aosp.yaml    # or anywhere you like
#   ./build-aosp.sh --config build-aosp.yaml fetch patch build
#
# Notes:
# - Command line options override the values in this file.
# - An empty value (e.g. "arch:") means "not specified"; the default is used.
# - Relative paths are resolved from the directory of this file. "~" is expanded.
# - Unknown keys and duplicate keys are errors.
# - Tasks (fetch, patch, build, patch-revert, bash), --daemon and --adduser are
#   command line only. They cannot be written here.
# - This file is YAML 1.1: yes/no/on/off are booleans. Quote strings if needed.
# - Use --print-config to see the resolved configuration without running docker.

# The version of this file format. Only 1 is supported. (required)
schema: 1

# The android version: 10, 11, 12 or 14. (required, here or --android)
# Do not add a leading zero: 014 is an octal number in YAML 1.1.
android: 14

# Build for Raspberry Pi 4 (true) or for the emulator (false).
# The same as "platform: rpi4".
# Default: false. Command line: --rpi / --no-rpi
rpi: true

# The platform to build for: rpi4, cuttlefish or emulator.
# rpi4 is the same as "rpi: true". "rpi: true" with another platform is an
# error. Android 10-12 support only the default.
# Default: rpi4 if rpi is true, otherwise cuttlefish (14) or emulator (10-12).
# Command line: --platform
platform:

# The form factor: phone, tv or auto.
# RPi supports only tv. Android 10-12 support only the default.
# Default: tv (14, and RPi of 10-12), phone (non-RPi of 10-12).
# The output directory gets a suffix if the platform or the form factor is
# not the default (e.g. android-14-x86_64-emulator-auto).
# Command line: --form-factor
form_factor:

# The target architecture: arm, arm64 or x86_64.
# Default: depends on the android version (10: arm, 11/12: arm64,
# 14: arm64 for RPi and x86_64 for the others).
# Android 12 and 14 for RPi support only arm64. Android 14 for cuttlefish
# and emulator supports only x86_64.
# Command line: --arch
arch: arm64

# The directory that stores sources. It must exist.
# The sources are placed in <workdir>/work.
# (required, here or --workdir)
workdir: ~/work/aosp/var

# The directory that output binaries. It must exist.
# (required, here or --outdir)
outdir: ~/work/aosp/out

# Use <workdir>/gen to separate the "out" directory for each architecture.
# Set false if "out" in the source directory is a real directory.
# Default: true. Command line: --gen / --no-gen
gen: true

# Mount the source directory to the same path in the container, to avoid
# broken symlinks when running the emulator.
# Default: false. Command line: --mount-same / --no-mount-same
mount_same: false
