# Example configuration for build-aosp.sh.
#
# Usage:
#   cp build-aosp.example.ini build-aosp.ini    # or anywhere you like
#   ./build-aosp.sh --config build-aosp.ini fetch patch build
#
# Notes:
# - The file is INI ("key = value"; ":" is not a separator). "#" and ";"
#   start comments. A comment after a value needs a space before it.
# - All keys are written in the [build-aosp] section. Other sections are errors.
# - Command line options override the values in this file.
# - An empty value (e.g. "arch =") means "not specified"; the default is used.
# - Do not quote values. Booleans are "true" or "false".
# - Relative paths are resolved from the directory of this file. "~" is expanded.
# - Unknown keys and duplicate keys are errors. Keys are case-sensitive.
# - Tasks (fetch, patch, build, patch-revert, bash), --daemon and --adduser are
#   command line only. They cannot be written here.
# - Use --print-config to see the resolved configuration without running docker.

[build-aosp]

# The version of this file format. Only 1 is supported. (required)
schema = 1

# The android version. (required, here or the command line)
# Command line: --android
# - 10 : Android 10
# - 11 : Android 11
# - 12 : Android 12
# - 14 : Android 14
android = 14

# Build for Raspberry Pi 4 or not. The same as "platform = rpi4".
# Command line: --rpi / --no-rpi
# - true  : build for Raspberry Pi 4
# - false : build for the host (cuttlefish or emulator) (Default)
rpi = true

# The platform to build for.
# Command line: --platform
# "rpi = true" with a platform other than rpi4 is an error (use --no-rpi to
# override "rpi = true" in this file).
# Android 10-12 support only the default.
# - rpi4       : Raspberry Pi 4. The same as "rpi = true"
#                (Default if rpi is true)
# - cuttlefish : cuttlefish on the host (Default for non-RPi of 14)
# - emulator   : the Android Emulator on the host
#                (Default for non-RPi of 10-12)
platform =

# The form factor.
# Command line: --form-factor
# RPi supports only tv. Android 10-12 support only the default.
# The output directory gets a suffix (e.g. android-14-x86_64-emulator-auto).
# - tv    : for TV form factor (Default for 14, and for RPi of 10-12)
# - phone : for phone form factor (Default for non-RPi of 10-12)
# - auto  : automotive form factor
form_factor =

# The target architecture.
# Command line: --arch
# Android 14 supports only arm64 for RPi and only x86_64 for the others.
# Android 12 for RPi supports only arm64.
# Android 10 and 11 for RPi support only arm and arm64.
# Android 10-12 for non-RPi support all of them.
# - arm    : 32-bit ARM (Default for 10)
# - arm64  : 64-bit ARM (Default for 11, 12, and RPi of 14)
# - x86_64 : x86_64 (Default for non-RPi of 14)
arch = arm64

# The directory that stores sources. (required, here or the command line)
# Command line: --workdir
# It must exist. The sources are placed in <workdir>/work.
workdir = ~/work/aosp/var

# The directory where the binaries are output.
# (required, here or the command line)
# Command line: --outdir
# It must exist.
outdir = ~/work/aosp/out

# Use <workdir>/gen to separate the "out" directory for each architecture.
# Command line: --gen / --no-gen
# - true  : "out" in the source directory becomes a symlink to
#           <workdir>/gen/out.<arch> (Default). Fails if "out" is a real
#           directory.
# - false : use "out" in the source directory as is. A symlink made by
#           "gen = true" is left dangling.
gen = true

# Mount the source directory to the same path in the container.
# Command line: --mount-same / --no-mount-same
# - true  : mount to the same path, to avoid broken symlinks when running
#           the emulator. Fails if the path is used in the container.
# - false : mount to /mnt/aosp (Default)
mount_same = false
